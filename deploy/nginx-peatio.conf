# nginx site for Peatio + the AI Control Room.
# install.sh fills in __DOMAIN__ / __ASSISTANT_DOMAIN__ and copies this to
# /etc/nginx/sites-available/peatio. Certbot then adds HTTPS.

server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 10m;

    # Disable gzip on login paths (protects against the BREACH attack).
    location ~ ^/auth/ {
        gzip off;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/peatio-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/peatio-proxy.conf;
    }
}

server {
    listen 80;
    server_name __ASSISTANT_DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:__ASSISTANT_PORT__;
        include /etc/nginx/peatio-proxy.conf;
        proxy_read_timeout 300s;   # small AI models on a small server can be slow
    }
}
